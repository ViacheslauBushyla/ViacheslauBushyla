<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 140" width="100%" height="140">
  <style>
    .card-bg { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 6px; }
    .metric-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 700; }
    .metric-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #c9d1d9; }
    .metric-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 400; fill: #8b949e; }
  </style>

  <rect width="840" height="140" fill="transparent" />

  <!-- Card 1 -->
  <g transform="translate(0, 5)">
    <rect width="200" height="126" class="card-bg" />
    <text x="16" y="38" class="metric-title" fill="#58a6ff">🏛️ 15+ Yrs</text>
    <text x="16" y="68" class="metric-label">Enterprise Architecture</text>
    <text x="16" y="90" class="metric-sub">Solution &amp; Test Architecture,</text>
    <text x="16" y="106" class="metric-sub">high-load &amp; cloud systems</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(213, 5)">
    <rect width="200" height="126" class="card-bg" />
    <text x="16" y="38" class="metric-title" fill="#7ee787">⚡ fnxt.app</text>
    <text x="16" y="68" class="metric-label">AI Benchmark Platform</text>
    <text x="16" y="90" class="metric-sub">Quantitative evaluation,</text>
    <text x="16" y="106" class="metric-sub">empirical LLM reasoning</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(426, 5)">
    <rect width="200" height="126" class="card-bg" />
    <text x="16" y="38" class="metric-title" fill="#f0883e">🧪 Test &amp; QA</text>
    <text x="16" y="68" class="metric-label">Quality Architecture</text>
    <text x="16" y="90" class="metric-sub">Test suite optimization,</text>
    <text x="16" y="106" class="metric-sub">CI/CD gates &amp; resilience</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(640, 5)">
    <rect width="200" height="126" class="card-bg" />
    <text x="16" y="38" class="metric-title" fill="#79c0ff">🤖 AI Agents</text>
    <text x="16" y="68" class="metric-label">Multi-Agent &amp; MCP</text>
    <text x="16" y="90" class="metric-sub">Autonomous workflows,</text>
    <text x="16" y="106" class="metric-sub">consensus &amp; toolchains</text>
  </g>
</svg>
